[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sarl"
version = "0.1.0"
description = "Aegis in-app firewall for Python. Inspects requests, reports what it saw, and blocks only when told to."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "waf", "runtime-protection", "wsgi", "middleware"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]
# No runtime dependencies on purpose. This sits in the request path of
# somebody's production application; every dependency is a supply chain risk
# a security tool has no business introducing.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["aegis_sarl"]
