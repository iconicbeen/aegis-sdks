# Publishes every SDK to its registry when a version tag is pushed.
#
# Each job checks for its own secret and skips itself when it is absent, so
# registries can be connected one at a time: a missing PyPI token does not stop
# the npm release. A job that has its secret and fails, fails the run.
#
# Secrets (repository settings -> Secrets and variables -> Actions):
#   NPM_TOKEN            npm automation token with publish rights on @aegis-sarl
#   PYPI_TOKEN           PyPI API token (scope: project aegis-sarl, or account)
#   RUBYGEMS_API_KEY     RubyGems API key with push rights
#   NUGET_API_KEY        NuGet API key with push rights for AegisSarl.*
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD
#                        Central Portal user token (central.sonatype.com)
#   MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE
#                        armoured key Central verifies signatures with
#
# Go needs nothing: the tag itself (go/vX.Y.Z) is the release.
# Packagist needs nothing here: once the repository is submitted at
# packagist.org it reads tags directly.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN not set; skipping npm" >> "$GITHUB_STEP_SUMMARY"
      - if: env.NODE_AUTH_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.NODE_AUTH_TOKEN != ''
        uses: oven-sh/setup-bun@v2
      - if: env.NODE_AUTH_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - if: env.NODE_AUTH_TOKEN != ''
        working-directory: node
        run: |
          # Only the build toolchain is installed (typescript, @types/node,
          # both pinned exactly in package.json); the package itself has no
          # dependencies to lock.
          bun install
          bun run build
          npm publish --access public --provenance
    permissions:
      contents: read
      id-token: write

  pypi:
    runs-on: ubuntu-latest
    env:
      TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      TWINE_USERNAME: __token__
    steps:
      - if: env.TWINE_PASSWORD == ''
        run: echo "PYPI_TOKEN not set; skipping PyPI" >> "$GITHUB_STEP_SUMMARY"
      - if: env.TWINE_PASSWORD != ''
        uses: actions/checkout@v4
      - if: env.TWINE_PASSWORD != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: env.TWINE_PASSWORD != ''
        working-directory: python
        run: |
          python -m pip install --upgrade build twine pytest
          python -m pytest -q
          python -m build
          python -m twine check dist/*
          python -m twine upload dist/*

  rubygems:
    runs-on: ubuntu-latest
    env:
      GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
    steps:
      - if: env.GEM_HOST_API_KEY == ''
        run: echo "RUBYGEMS_API_KEY not set; skipping RubyGems" >> "$GITHUB_STEP_SUMMARY"
      - if: env.GEM_HOST_API_KEY != ''
        uses: actions/checkout@v4
      - if: env.GEM_HOST_API_KEY != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - if: env.GEM_HOST_API_KEY != ''
        working-directory: ruby
        run: |
          gem build aegis-sarl.gemspec
          gem push aegis-sarl-*.gem

  nuget:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - if: env.NUGET_API_KEY == ''
        run: echo "NUGET_API_KEY not set; skipping NuGet" >> "$GITHUB_STEP_SUMMARY"
      - if: env.NUGET_API_KEY != ''
        uses: actions/checkout@v4
      - if: env.NUGET_API_KEY != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - if: env.NUGET_API_KEY != ''
        working-directory: dotnet
        run: |
          dotnet run --project tests/Aegis.Security.Tests.csproj
          dotnet pack src/Aegis.Security.csproj -c Release -o out
          dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  maven:
    runs-on: ubuntu-latest
    env:
      CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
    steps:
      - if: env.CENTRAL_USER == ''
        run: echo "MAVEN_CENTRAL_USERNAME not set; skipping Maven Central" >> "$GITHUB_STEP_SUMMARY"
      - if: env.CENTRAL_USER != ''
        uses: actions/checkout@v4
      - if: env.CENTRAL_USER != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - if: env.CENTRAL_USER != ''
        working-directory: java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -P release deploy
